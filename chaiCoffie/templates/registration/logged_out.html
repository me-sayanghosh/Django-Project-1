{% extends "layout.html" %}

{% block title %}Logged Out - Chai Tweet{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-secondary text-center shadow-sm p-4">
            <div class="card-body">
                <h3 class="card-title text-warning fw-bold mb-3">👋 Logged Out</h3>
                <p class="text-body-secondary mb-4">You have been logged out of your account successfully.</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'login' %}" class="btn btn-warning">Log In Again</a>
                    <a href="{% url 'tweet_list' %}" class="btn btn-outline-secondary">Back to Tweets</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
