{% extends "layout.html" %}

{% block title %}Logged Out - Chai Tweet{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-16">
    
    <div class="rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 overflow-hidden shadow-xs text-center">
        
        <!-- Mac Window Top Bar -->
        <div class="px-5 py-3 bg-zinc-50 dark:bg-zinc-950/60 border-b border-zinc-100 dark:border-zinc-800/80 flex items-center justify-between">
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-red-400/90 inline-block"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400/90 inline-block"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400/90 inline-block"></span>
            </div>
            <span class="text-xs font-mono text-zinc-400">
                account/logout
            </span>
        </div>

        <div class="p-8 space-y-5">
            <div class="w-12 h-12 mx-auto rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-xl">
                👋
            </div>

            <div class="space-y-1">
                <h2 class="text-2xl font-bold tracking-tight text-zinc-950 dark:text-white">
                    You've been logged out
                </h2>
                <p class="text-xs text-zinc-500 dark:text-zinc-400">
                    Thank you for using Chai Tweet. You can sign back in anytime.
                </p>
            </div>

            <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3">
                <a href="{% url 'login' %}" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-full text-xs font-semibold bg-zinc-950 hover:bg-zinc-800 dark:bg-white dark:hover:bg-zinc-200 text-white dark:text-zinc-950 transition">
                    Sign In Again
                </a>
                <a href="{% url 'tweet_list' %}" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-full text-xs font-medium border border-zinc-200 dark:border-zinc-800 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-50 dark:hover:bg-zinc-800 transition">
                    Back to Feed
                </a>
            </div>
        </div>
    </div>

</div>
{% endblock %}
