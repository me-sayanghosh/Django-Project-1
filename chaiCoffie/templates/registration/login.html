{% extends "layout.html" %}

{% block title %}Login - Chai Tweet{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-secondary shadow-sm">
            <div class="card-header border-secondary bg-body-tertiary">
                <h4 class="mb-0 fw-bold text-warning">🔑 Sign In to Chai Tweet</h4>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Your username and password didn't match. Please try again.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control" placeholder="Enter username">
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control" placeholder="Enter password">
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold">Login</button>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-secondary">
                    <p class="mb-0 text-body-secondary">
                        Don't have an account? <a href="{% url 'register' %}" class="text-warning">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
